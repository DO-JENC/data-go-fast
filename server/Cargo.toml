[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true }
aws-creds = "0.39.1"
axum = { version = "0.8.9", features = ["multipart"] }
tower-http = { version = "0.6.2", features = ["cors"] }
redis = { version = "1.2.1", features = ["tokio-comp", "json", "aio", "connection-manager"] }
rust-s3 = "0.37.2"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
sqlx = { version = "0.8.6", features = ["uuid"] }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
argon2 = "0.5.3"
apalis = "0.7.4"
apalis-redis = "0.7.4"
apalis-core = "0.7.4"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
serde_json = "1.0.150"
chrono = "0.4.44"
rand = "0.10.1"
sha2 = "0.11.0"
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
hex = "0.4.3"
time = "0.3"
cookie = "0.18"
