[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true }
aws-creds = "0.39.1"
axum = "0.8.9"
dotenvy = "0.15.7"
redis = { version = "1.2.1", features = ["tokio-comp", "json"] }
rust-s3 = "0.37.2"
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
sqlx = "0.8.6"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
